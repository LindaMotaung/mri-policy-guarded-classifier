name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
    # Only redeploy the live Space when something that actually affects the
    # served app changes - not on every push to main (docs, other workflow
    # files, etc. used to trigger a spurious rebuild/restart otherwise).
    paths:
      - "app.py"
      - "mri/**"
      - "model_bundle/**"
      - "requirements.txt"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          git push --force https://LindaMot:$HF_TOKEN@huggingface.co/spaces/LindaMot/mri-tumor-classifier main
